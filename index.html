<style>
  :root {
    --bg: #fff;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
    --blue: #1a73e8;
    --blue-bg: #e8f0fe;
    --hover: #f1f3f4;
    --pane-idle: #f5f5f5;
    --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202124;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #5f6368;
      --blue: #8ab4f8;
      --blue-bg: #394457;
      --hover: #303134;
      --pane-idle: #28292c;
      --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #202124;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #5f6368;
    --blue: #8ab4f8;
    --blue-bg: #394457;
    --hover: #303134;
    --pane-idle: #28292c;
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  * { box-sizing: border-box; }
  /* Keyboard focus ring drawn inside controls so it never spills over neighbouring borders */
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  html, body { margin: 0; height: 100%; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }   /* no double-tap zoom */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 0 24px; border-bottom: 1px solid var(--border);
    font-family: "Google Sans", Roboto, sans-serif; font-size: 22px; color: var(--muted);
  }
  header b { font-weight: 400; }
  header .spacer { flex: 1; }
  .hdr-wrap { position: relative; }
  .settings {
    position: absolute; top: 48px; right: 0; z-index: 20; width: 280px; background: var(--bg); color: var(--text);
    box-shadow: var(--shadow); border-radius: 8px; padding: 16px; font: 14px Roboto, sans-serif;
  }
  .settings[hidden] { display: none; }
  .settings h3 { margin: 0 0 12px; font: 500 16px "Google Sans", Roboto, sans-serif; }
  .settings label { display: block; color: var(--muted); font-size: 13px; margin: 14px 0 6px; }
  .settings .row { display: flex; align-items: center; gap: 10px; }
  .settings input[type=range] { flex: 1; accent-color: var(--blue); }
  .settings .val { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .settings select {
    width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); font: 14px Roboto, sans-serif;
  }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: none; color: var(--text); padding: 7px 0; cursor: pointer; font: 500 13px "Google Sans", Roboto, sans-serif; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--blue-bg); color: var(--blue); }
  .mic.listening, .mic.listening:hover { color: #fff; background: #d93025; animation: pulse 1.2s infinite; }
  .mic.listening:hover { background: #b3261e; }
  .speak.playing, .speak.playing:hover { color: #fff; background: var(--blue); animation: pulse-blue 1.2s infinite; }
  :root[data-theme="dark"] .speak.playing { color: #202124; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .speak.playing { color: #202124; } }
  .speak.playing .ms { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
  @keyframes pulse-blue { 0%,100% { box-shadow: 0 0 0 0 rgba(26,115,232,.45); } 50% { box-shadow: 0 0 0 8px rgba(26,115,232,0); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,48,37,.5); } 50% { box-shadow: 0 0 0 8px rgba(217,48,37,0); } }
  header .g { font-weight: 500; letter-spacing: -.5px; text-decoration: none; border-radius: 4px; }
  header .g:hover { opacity: .85; }
  header .g:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  header .g span:nth-child(1), header .g span:nth-child(4) { color: #4285f4; }
  header .g span:nth-child(2), header .g span:nth-child(6) { color: #ea4335; }
  header .g span:nth-child(3) { color: #fbbc05; }
  header .g span:nth-child(5) { color: #34a853; }
  :root[data-theme="dark"] header .g span { color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header .g span { color: #fff; } }

  main { flex: 1; display: flex; flex-direction: column; padding: 24px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .langbar { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); position: relative; }
  .side-tabs { flex: 1; display: flex; align-items: stretch; min-width: 0; overflow: hidden; }
  .tab {
    border: 0; background: none; color: var(--muted); cursor: pointer;
    font: 500 14px "Google Sans", Roboto, sans-serif; padding: 0 16px; height: 48px;
    white-space: nowrap; position: relative; flex-shrink: 0;
  }
  .tab:hover { background: var(--hover); }
  .tab.active { color: var(--blue); }
  .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px 2px 0 0; }
  .more {
    border: 0; background: none; color: var(--muted); cursor: pointer; width: 40px; height: 40px; align-self: center;
    border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; margin: 0 4px;
  }
  .more:hover, .iconbtn:hover { background: var(--hover); }
  .more .ms { transition: transform .2s; }
  .more.open .ms { transform: rotate(180deg); }
  .ms {
    font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1;
    letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; display: inline-block;
    -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; user-select: none;
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; width: 1em; overflow: hidden;
  }
  .mic.listening .ms, .mic.busy .ms { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
  .mic.busy { color: var(--blue); animation: spin-bg 1s linear infinite; }
  @keyframes spin-bg { 50% { background: var(--blue-bg); } }
  .voicewrap { position: relative; display: flex; }
  .voicewrap[hidden] { display: none; }
  .voicebtn { position: relative; }
  .voicebtn .ms { transition: transform .2s; }
  .voicebtn.open .ms { transform: rotate(180deg); }
  .voicebtn.auto::after { content: ""; position: absolute; top: 7px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  .voicebtn { width: 24px; border-radius: 12px; margin-left: 2px; }
  .vmenu {
    position: absolute; bottom: 44px; left: 0; z-index: 15; width: 320px; max-width: calc(100vw - 48px); max-height: min(460px, 60vh);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); box-shadow: var(--shadow); border-radius: 8px;
  }
  .vmenu[hidden] { display: none; }
  .vmenu .vlist { overflow: auto; padding: 8px 0 4px; min-height: 0; flex: 1; }
  .vmenu .vfoot { flex-shrink: 0; padding: 6px 0; }
  .vmenu button.vrow { display: flex; align-items: center; gap: 14px; padding: 11px 12px 11px 16px; }
  .vmenu .vrow .ms { font-size: 20px; color: var(--muted); }
  .vmenu .vrow .label { flex: 1; }
  .vmenu .vrow .value { color: var(--muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vmenu .vrow .chev { margin-left: -8px; }
  .vmenu .vrow.back { flex-shrink: 0; border-bottom: 1px solid var(--border); padding: 12px 16px; font-weight: 500; }
  .vmenu .vrow.back .ms { color: var(--text); }
  .vmenu .head { padding: 6px 16px 8px; color: var(--muted); font-size: 12px; }
  .vmenu button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 9px 16px 9px 40px; font: 14px Roboto, sans-serif; cursor: pointer; position: relative;
  }
  .vmenu button:hover { background: var(--hover); }
  .vmenu button.sel { color: var(--blue); }
  /* Selected item in any menu: the same Material check icon */
  .vmenu button.sel::before, .picker .opt.sel::before {
    content: "check"; font-family: "Material Symbols Outlined"; font-size: 20px; line-height: 1;
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  }
  .vmenu .vlist button { display: flex; align-items: center; gap: 12px; padding-right: 30px; }
  .vmenu .vlist button .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vmenu .vlist button .flag { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .vmenu .none { padding: 8px 16px; color: var(--muted); font-size: 13px; }
  .swap {
    width: 40px; height: 40px; margin: 0 12px; align-self: center; border: 0; border-radius: 50%; background: none;
    color: var(--muted); cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
  }
  .swap:hover { background: var(--hover); }

  .panes { display: flex; gap: 0; flex: 1; min-height: 320px; margin-top: 0; position: relative; }
  .loadbar { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; z-index: 2; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .loadbar.on { opacity: 1; }
  .loadbar::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--blue);
    animation: loadbar 1.1s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes loadbar { from { left: -40%; } to { left: 100%; } }
  .pane {
    flex: 1; position: relative; display: flex; flex-direction: column;
    border: 1px solid var(--border); border-top: 0; background: var(--bg); min-width: 0;
    transition: background .15s;
  }
  .pane.left { border-radius: 0 0 0 16px; }
  .pane.right { border-radius: 0 0 16px 0; border-left: 0; }
  .pane.output { background: var(--pane-idle); }
  textarea {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: 28px/40px Roboto, Arial, sans-serif; padding: 20px 56px 20px 24px;
  }
  textarea.medium { font-size: 22px; line-height: 32px; }
  textarea.small { font-size: 18px; line-height: 28px; }
  textarea::placeholder { color: var(--muted); }
  .clear { position: absolute; top: 12px; right: 8px; }
  .iconbtn {
    width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    cursor: pointer; display: grid; place-items: center;
  }
  .iconbtn[hidden], .ms[hidden] { display: none; }
  a.iconbtn { text-decoration: none; }
  .foot { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px 8px; color: var(--muted); font-size: 12px; min-height: 52px; }
  .foot .grow { flex: 1; }
  .convbtn {
    display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border-radius: 18px; cursor: pointer;
    border: 1px solid var(--border); background: none; color: var(--text); font: 500 14px "Google Sans", Roboto, sans-serif;
  }
  .convbtn:hover { background: var(--hover); }
  .convbtn.on { background: var(--blue); border-color: var(--blue); color: var(--bg); }
  .convbar {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 8px 8px 16px; border-radius: 24px;
    background: var(--blue-bg); color: var(--blue); font: 500 14px "Google Sans", Roboto, sans-serif;
  }
  .convbar[hidden] { display: none; }
  .convbar .grow { flex: 1; }
  .convbar button { border: 0; border-radius: 16px; padding: 7px 16px; background: var(--blue); color: var(--bg); font: inherit; cursor: pointer; }
  .convbar.listening .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .pane.turn { box-shadow: inset 0 0 0 2px var(--blue); }
  .settings .switch { display: flex; align-items: center; justify-content: space-between; color: var(--text); font-size: 14px; margin-top: 18px; cursor: pointer; }
  .switch input { display: none; }
  .switch i { width: 36px; height: 20px; border-radius: 10px; background: var(--border); position: relative; transition: .2s; flex-shrink: 0; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + i { background: var(--blue); }
  .switch input:checked + i::after { left: 18px; }
  .status { font-size: 13px; color: var(--muted); padding: 0 24px; min-height: 20px; }
  .status.err { color: #d93025; }

  .picker {
    position: absolute; top: 49px; left: 0; right: 0; z-index: 10; background: var(--bg);
    box-shadow: var(--shadow); border-radius: 0 0 8px 8px; padding: 8px 0 16px; max-height: 60vh; display: flex; flex-direction: column;
  }
  .picker[hidden] { display: none; }
  .picker input {
    margin: 0 16px 8px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent;
    color: var(--text); font: 16px Roboto, sans-serif; outline: 0;
  }
  .picker .list { overflow: auto; columns: 5 170px; column-gap: 0; padding: 0 8px; }
  .picker .opt {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 9px 16px 9px 40px; font: 14px Roboto, sans-serif; cursor: pointer; break-inside: avoid; position: relative;
  }
  .picker .opt:hover { background: var(--hover); }
  .picker .opt.sel { color: var(--blue); }

  .toast {
    position: fixed; left: 24px; bottom: 24px; max-width: calc(100vw - 48px); background: #323232; color: #fff; padding: 12px 20px;
    border-radius: 4px; font-size: 14px; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    main { padding: 12px 16px; }
    .panes { flex-direction: column; }
    .pane.left { border-radius: 0; }
    .pane.right { border-radius: 0 0 16px 16px; border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
    .langbar .side-tabs .tab:not(.active) { display: none; }
    .langbar .side-tabs .tab.active { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
    header { padding: 0 12px 0 16px; gap: 6px; }
    .convbtn .lbl { display: none; }
    .convbtn { padding: 0 8px; }
    textarea { font-size: 22px; line-height: 32px; }
  }
</style>

      <button class="iconbtn clear" data-side="1" title="Clear" hidden><span class="ms" style="font-size:24px">close</span></button>

        <button class="iconbtn mic" data-side="1" title="Translate by voice"><span class="ms" style="font-size:24px">mic</span></button>
        <span class="voicewrap"><button class="iconbtn speak" data-side="1" title="Listen"><span class="ms" style="font-size:24px">volume_up</span></button><button class="iconbtn voicebtn" data-side="1" title="Choose voice"><span class="ms" style="font-size:20px">expand_more</span></button><div class="vmenu" data-side="1" hidden></div></span>
        <span class="grow"></span>
        <span class="count" id="count-1">0 / 5,000</span>

</main>
<div class="toast" id="toast"></div>

<script>
const LANGS = {
  af:"Afrikaans", sq:"Albanian", am:"Amharic", ar:"Arabic", hy:"Armenian", as:"Assamese", ay:"Aymara", az:"Azerbaijani",
  bm:"Bambara", eu:"Basque", be:"Belarusian", bn:"Bengali", bho:"Bhojpuri", bs:"Bosnian", bg:"Bulgarian", ca:"Catalan",
  ceb:"Cebuano", ny:"Chichewa", "zh-CN":"Chinese (Simplified)", "zh-TW":"Chinese (Traditional)", co:"Corsican", hr:"Croatian",
  cs:"Czech", da:"Danish", dv:"Dhivehi", doi:"Dogri", nl:"Dutch", en:"English", eo:"Esperanto", et:"Estonian", ee:"Ewe",
  tl:"Filipino", fi:"Finnish", fr:"French", fy:"Frisian", gl:"Galician", ka:"Georgian", de:"German", el:"Greek",
  gn:"Guarani", gu:"Gujarati", ht:"Haitian Creole", ha:"Hausa", haw:"Hawaiian", iw:"Hebrew", hi:"Hindi", hmn:"Hmong",
  hu:"Hungarian", is:"Icelandic", ig:"Igbo", ilo:"Ilocano", id:"Indonesian", ga:"Irish", it:"Italian", ja:"Japanese",
  jw:"Javanese", kn:"Kannada", kk:"Kazakh", km:"Khmer", rw:"Kinyarwanda", gom:"Konkani", ko:"Korean", kri:"Krio",
  ku:"Kurdish (Kurmanji)", ckb:"Kurdish (Sorani)", ky:"Kyrgyz", lo:"Lao", la:"Latin", lv:"Latvian", ln:"Lingala",
  lt:"Lithuanian", lg:"Luganda", lb:"Luxembourgish", mk:"Macedonian", mai:"Maithili", mg:"Malagasy", ms:"Malay",
  ml:"Malayalam", mt:"Maltese", mi:"Maori", mr:"Marathi", "mni-Mtei":"Meiteilon (Manipuri)", lus:"Mizo", mn:"Mongolian",
  my:"Myanmar (Burmese)", ne:"Nepali", no:"Norwegian", or:"Odia (Oriya)", om:"Oromo", ps:"Pashto", fa:"Persian",
  pl:"Polish", pt:"Portuguese (Brazil)", "pt-PT":"Portuguese (Portugal)", pa:"Punjabi", qu:"Quechua", ro:"Romanian", ru:"Russian", sm:"Samoan", sa:"Sanskrit",
  gd:"Scots Gaelic", nso:"Sepedi", sr:"Serbian", st:"Sesotho", sn:"Shona", sd:"Sindhi", si:"Sinhala", sk:"Slovak",
  sl:"Slovenian", so:"Somali", es:"Spanish", su:"Sundanese", sw:"Swahili", sv:"Swedish", tg:"Tajik", ta:"Tamil",
  tt:"Tatar", te:"Telugu", th:"Thai", ti:"Tigrinya", ts:"Tsonga", tr:"Turkish", tk:"Turkmen", ak:"Twi", uk:"Ukrainian",
  ur:"Urdu", ug:"Uyghur", uz:"Uzbek", vi:"Vietnamese", cy:"Welsh", xh:"Xhosa", yi:"Yiddish", yo:"Yoruba", zu:"Zulu"
};
const AUTO = "auto";
const MAX = 5000;

// ---- state (persisted) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem("tr:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tr:" + k, JSON.stringify(v)); } catch {} }
};
const state = {
  lang: store.get("lang", [AUTO, "en"]),              // selected language per side ("auto" = detect)
  recent: store.get("recent", [["en", "es", "fr"], ["en", "es", "fr"]]),
  detected: [null, null],                             // last detected language per side
  source: null,                                       // side the user last typed in
};
const els = {
  text: [document.getElementById("text-0"), document.getElementById("text-1")],
  panes: [...document.querySelectorAll(".pane")],
  tabs: [document.getElementById("tabs-0"), document.getElementById("tabs-1")],
  count: [document.getElementById("count-0"), document.getElementById("count-1")],
  clear: [...document.querySelectorAll(".clear")],
  status: document.getElementById("status"),
  picker: document.getElementById("picker"),
  pickerSearch: document.getElementById("picker-search"),
  pickerList: document.getElementById("picker-list"),
};

// The effective language of a side: its selection, or what we detected there, or English as a last resort.
function effectiveLang(side) {
  const l = state.lang[side];
  return l !== AUTO ? l : (state.detected[side] || "en");
}

// ---- translation ----
async function googleTranslate(text, sl, tl, signal) {
  const body = new URLSearchParams({ q: text });
  const url = `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}`;
  try {
    const r = await fetch(url, { method: "POST", body, signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    // sl=auto -> [["text","fr"]]; explicit sl -> ["text"]
    const first = j[0];
    return Array.isArray(first) ? { text: first[0], detected: first[1] } : { text: first, detected: null };
  } catch (e) {
    if (e.name === "AbortError") throw e;
    // fallback endpoint
    const u2 = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}`;
    const r = await fetch(u2, { method: "POST", body, signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    return { text: (j[0] || []).map(s => s[0]).join(""), detected: j[2] || null };
  }
}

let timer = null, controller = null, readTimer = null;
function schedule(side, delay = 350) {
  clearTimeout(timer);
  timer = setTimeout(() => translateFrom(side), delay);
}

async function translateFrom(side) {
  const other = 1 - side;
  const text = els.text[side].value;
  if (controller) controller.abort();
  if (!text.trim()) {
    setLoading(false);
    els.text[other].value = "";
    if (state.lang[side] === AUTO) state.detected[side] = null;
    refresh();
    return;
  }
  controller = new AbortController();
  const sl = state.lang[side];
  const tl = effectiveLang(other);
  setStatus("");
  setLoading(true);
  try {
    const res = await googleTranslate(text, sl, tl, controller.signal);
    if (state.source !== side || els.text[side].value !== text) return; // stale
    els.text[other].value = res.text;
    if (sl === AUTO && res.detected) state.detected[side] = res.detected;
    setLoading(false);
    refresh();
    if (state.typed && settings.autoRead[other]) {
      clearTimeout(readTimer);
      readTimer = setTimeout(() => speak(res.text, other), 1200);
    }
    return true;
  } catch (e) {
    if (e.name === "AbortError") return;
    setLoading(false);
    setStatus("Translation failed: " + e.message, true);
  }
}

// Only show the loading bar if the request is actually slow, so quick translations don't flicker.
let loadTimer = null;
function setLoading(on) {
  clearTimeout(loadTimer);
  const bar = document.getElementById("loadbar");
  if (on) loadTimer = setTimeout(() => bar.classList.add("on"), 250);
  else bar.classList.remove("on");
}

function setStatus(msg, err) {
  els.status.textContent = msg;
  els.status.classList.toggle("err", !!err);
}

// ---- UI ----
function renderTabs(side) {
  const box = els.tabs[side];
  box.innerHTML = "";
  const sel = state.lang[side];
  const detectLabel = sel === AUTO && state.detected[side] && LANGS[state.detected[side]]
    ? `${LANGS[state.detected[side]]} - Detected` : "Detect language";
  if (sel !== AUTO && !state.recent[side].includes(sel)) state.recent[side] = [sel, ...state.recent[side]].slice(0, 3);
  const items = [[AUTO, detectLabel], ...state.recent[side].map(c => [c, LANGS[c]])];
  for (const [code, label] of items) {
    const b = document.createElement("button");
    b.className = "tab" + (code === sel ? " active" : "");
    b.textContent = label;
    b.onclick = () => chooseLang(side, code);
    box.appendChild(b);
  }
}

// Keep the big text until it would overflow the box, then step down a size at a time.
function fitText(t) {
  t.classList.remove("medium", "small");
  for (const size of ["medium", "small"]) {
    if (t.scrollHeight <= t.clientHeight + 1) break;
    t.classList.remove("medium", "small");
    t.classList.add(size);
  }
}
addEventListener("resize", () => els.text.forEach(fitText));

function refresh() {
  for (const s of [0, 1]) {
    renderTabs(s);
    const t = els.text[s];
    const n = t.value.length;
    els.count[s].textContent = `${n.toLocaleString()} / ${MAX.toLocaleString()}`;
    els.clear[s].hidden = n === 0;
    fitText(t);
    els.panes[s].classList.toggle("output", state.source != null && state.source !== s && n > 0);
  }
  store.set("lang", state.lang);
  store.set("recent", state.recent);
}

function chooseLang(side, code) {
  state.lang[side] = code;
  if (code !== AUTO) {
    const r = state.recent[side].filter(c => c !== code);
    r.unshift(code);
    state.recent[side] = r.slice(0, 3);
  }
  closePicker();
  refresh();
  retranslate();
}

// Re-run the translation from whichever side the user last typed in.
function retranslate() {
  const src = state.source ?? (els.text[0].value ? 0 : els.text[1].value ? 1 : null);
  if (src == null) return;
  state.source = src;
  translateFrom(src);
}

for (const side of [0, 1]) {
  const t = els.text[side];
  t.maxLength = MAX;
  t.addEventListener("input", () => {
    state.source = side;
    state.typed = true;
    clearTimeout(readTimer);
    if (!conv.on) stopSpeaking();
    refresh();
    schedule(side);
  });
  t.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); state.source = side; clearTimeout(timer); translateFrom(side); }
  });
  els.clear[side].onclick = () => {
    t.value = ""; els.text[1 - side].value = ""; state.source = side;
    if (controller) controller.abort();
    refresh(); t.focus();
  };
}

document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
  const v = els.text[+b.dataset.side].value;
  if (!v) return;
  try { await navigator.clipboard.writeText(v); toast("Translation copied"); } catch { toast("Copy failed"); }
});


// Swap only swaps the languages; text stays put since both boxes are live anyway.
function swap() {
  const [a, b] = [effectiveLang(0), effectiveLang(1)];
  const aWasAuto = state.lang[0] === AUTO, bWasAuto = state.lang[1] === AUTO;
  state.lang = [bWasAuto ? AUTO : b, aWasAuto ? AUTO : a];
  state.detected = [state.detected[1], state.detected[0]];
  for (const s of [0, 1]) if (state.lang[s] !== AUTO && !state.recent[s].includes(state.lang[s])) {
    state.recent[s] = [state.lang[s], ...state.recent[s]].slice(0, 3);
  }
  const [t0, t1] = [els.text[0].value, els.text[1].value];
  els.text[0].value = t1; els.text[1].value = t0;
  if (state.source != null) state.source = 1 - state.source;
  refresh();
}
document.getElementById("swap").onclick = swap;
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "s" && e.shiftKey && (e.ctrlKey || e.metaKey)) { e.preventDefault(); swap(); }
  if (e.key === "Escape") closePicker();
});

// ---- dropdowns: only one open at a time ----
function closeMenus(except) {
  if (except !== "picker") closePicker();
  if (except !== "voice") closeVoiceMenus();
  if (except !== "settings") document.getElementById("settings").hidden = true;
}

// ---- language picker ----
let pickerSide = null;
function openPicker(side) {
  if (pickerSide === side) return closePicker();
  closeMenus("picker");
  pickerSide = side;
  document.querySelectorAll(".more").forEach(m => m.classList.toggle("open", +m.dataset.side === side));
  els.picker.hidden = false;
  els.pickerSearch.value = "";
  renderPicker();
  els.pickerSearch.focus();
}
function closePicker() {
  pickerSide = null;
  els.picker.hidden = true;
  document.querySelectorAll(".more").forEach(m => m.classList.remove("open"));
}
function renderPicker() {
  const q = els.pickerSearch.value.trim().toLowerCase();
  const entries = [[AUTO, "Detect language"], ...Object.entries(LANGS).sort((a, b) => a[1].localeCompare(b[1]))]
    .filter(([c, n]) => !q || n.toLowerCase().includes(q) || c.toLowerCase() === q);
  els.pickerList.innerHTML = "";
  for (const [code, name] of entries) {
    const b = document.createElement("button");
    b.className = "opt" + (state.lang[pickerSide] === code ? " sel" : "");
    b.textContent = name;
    b.onclick = () => chooseLang(pickerSide, code);
    els.pickerList.appendChild(b);
  }
}
document.querySelectorAll(".more").forEach(m => m.onclick = e => { e.stopPropagation(); openPicker(+m.dataset.side); });
els.pickerSearch.addEventListener("input", renderPicker);
els.pickerSearch.addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = els.pickerList.querySelector(".opt"); if (first) first.click(); }
});
document.addEventListener("click", e => { if (pickerSide != null && !els.picker.contains(e.target)) closePicker(); });

// ---- settings: theme, voice speed, voice ----
const settings = Object.assign({ theme: "system", rate: 1, voices: {}, autoRead: [false, false] }, store.get("settings", {}));
if (!Array.isArray(settings.autoRead)) settings.autoRead = [false, false];   // was a single on/off switch
// During a conversation both boxes read aloud temporarily; save the user's own choice instead.
const saveSettings = () => store.set("settings", convActive() ? { ...settings, autoRead: conv.savedAutoRead } : settings);
const convActive = () => { try { return conv.on; } catch { return false; } };
const darkMQ = matchMedia("(prefers-color-scheme: dark)");

function applyTheme() {
  const root = document.documentElement;
  if (settings.theme === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", settings.theme);
  const dark = settings.theme === "dark" || (settings.theme === "system" && darkMQ.matches);
  document.querySelector(".i-moon").hidden = dark;
  document.querySelector(".i-sun").hidden = !dark;
  document.getElementById("theme-btn").title = dark ? "Switch to light mode" : "Switch to dark mode";
  document.querySelectorAll("#theme-seg button").forEach(b => b.classList.toggle("on", b.dataset.v === settings.theme));
}
function setTheme(t) { settings.theme = t; saveSettings(); applyTheme(); }
document.getElementById("theme-btn").onclick = () => {
  const dark = settings.theme === "dark" || (settings.theme === "system" && darkMQ.matches);
  setTheme(dark ? "light" : "dark");
};
document.querySelectorAll("#theme-seg button").forEach(b => b.onclick = () => setTheme(b.dataset.v));
darkMQ.addEventListener("change", applyTheme);

const settingsPanel = document.getElementById("settings");
document.getElementById("settings-btn").onclick = e => {
  e.stopPropagation();
  const open = settingsPanel.hidden;
  closeMenus("settings");
  settingsPanel.hidden = !open;
};
document.addEventListener("click", e => { if (!settingsPanel.hidden && !settingsPanel.contains(e.target)) settingsPanel.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") settingsPanel.hidden = true; });

// Voice speed is remembered per language: settings.rates[googleCode].
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5];
if (!settings.rates) settings.rates = {};
const rateFor = code => settings.rates[code] ?? 1;

// Google codes -> BCP 47 tags the speech APIs understand.
function bcp47(code) {
  if (code === AUTO) return navigator.language || "en-US";
  return ({ iw: "he", jw: "jv", pt: "pt-BR", "mni-Mtei": "mni" })[code] || code;
}
const prefix = tag => tag.toLowerCase().split(/[-_]/)[0];

// Voices are chosen per box and per language: settings.voices[side][googleCode] = "google" | device voiceURI.
// Google's voice (the one translate.google.com uses) is the default; device voices are the fallback.
if (!settings.voices || !settings.voices[0]) settings.voices = { 0: {}, 1: {} };
const GOOGLE = "google";
// Extra accents Google's voice supports (requested via a regional language code); other languages have one voice.
const GOOGLE_ACCENTS = {
  en: { def: ["English (US)", "US"], more: [["en-GB", "English (UK)", "GB"], ["en-AU", "English (Australia)", "AU"], ["en-IN", "English (India)", "IN"], ["en-NG", "English (Nigeria)", "NG"]] },
  es: { def: ["Spanish (Latin America)", null], more: [["es-ES", "Spanish (Spain)", "ES"]] },
  fr: { def: ["French (France)", "FR"], more: [["fr-CA", "French (Canada)", "CA"]] },
};
// Country whose flag best represents each language's single Google voice (only where it's unambiguous).
const LANG_FLAG = {
  pt: "BR", "pt-PT": "PT", de: "DE", it: "IT", ja: "JP", ko: "KR", "zh-CN": "CN", "zh-TW": "TW", ru: "RU", nl: "NL", pl: "PL",
  tr: "TR", sv: "SE", da: "DK", no: "NO", fi: "FI", el: "GR", cs: "CZ", hu: "HU", ro: "RO", uk: "UA", th: "TH", vi: "VN",
  id: "ID", ms: "MY", tl: "PH", iw: "IL", fa: "IR", hi: "IN", bn: "BD", ur: "PK", sk: "SK", bg: "BG", hr: "HR", sr: "RS",
  sl: "SI", lt: "LT", lv: "LV", et: "EE", is: "IS", ga: "IE", ka: "GE", hy: "AM", kk: "KZ", uz: "UZ", mn: "MN", ne: "NP",
  si: "LK", km: "KH", lo: "LA", my: "MM", sw: "KE", af: "ZA", sq: "AL", mk: "MK", bs: "BA", mt: "MT", cy: "GB",
};
const flag = cc => cc ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1f1a5 + c.charCodeAt(0))) : "";
const regionName = cc => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(cc); } catch { return cc; } };
const isGoogle = v => typeof v === "string";          // GOOGLE or "google:en-GB"

// macOS novelty voices that just clutter the list.
const JOKE_VOICES = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Pipe Organ)\b/;
// Chrome appends the language to names ("Eddy (Portuguese (Brazil))"); the menu already says it.
const voiceName = v => v.name.replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/, "");
const voiceQuality = v => /premium/i.test(v.voiceURI) ? 2 : /enhanced/i.test(v.voiceURI) ? 1 : 0;
function voicesFor(tag) {
  if (!window.speechSynthesis) return [];
  const norm = l => l.toLowerCase().replace("_", "-");
  const seen = new Set();
  return speechSynthesis.getVoices()
    .filter(v => prefix(v.lang) === prefix(tag) && !JOKE_VOICES.test(v.name))
    // Safari lists some voices more than once (same voice, or compact + enhanced copies); keep one of each.
    .sort((a, b) => voiceQuality(b) - voiceQuality(a))
    .filter(v => { const k = voiceName(v) + "|" + v.lang; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (norm(b.lang) === norm(tag)) - (norm(a.lang) === norm(tag)) || a.name.localeCompare(b.name));
}
// Returns GOOGLE, "google:<accent code>" or a SpeechSynthesisVoice.
function pickVoice(side) {
  const code = effectiveLang(side), chosen = settings.voices[side][code];
  if (!chosen || chosen.startsWith(GOOGLE)) return chosen || GOOGLE;
  return voicesFor(bcp47(code)).find(v => v.voiceURI === chosen) || GOOGLE;
}

const player = new Audio();
const SILENT_MP3 = "data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYzLjEuMTAxAAAAAAAAAAAAAAD/84TAAAAAAAAAAAAASW5mbwAAAA8AAAAFAAACoABtbW1tbW1tbW1tbW1tbW1tbW1tkpKSkpKSkpKSkpKSkpKSkpKSkpK2tra2tra2tra2tra2tra2tra2ttvb29vb29vb29vb29vb29vb29vb//////////////////////////8AAAAATGF2YzYzLjEuAAAAAAAAAAAAAAAAJARQAAAAAAAAAqDr4QetAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/80TEAAAAA0gAAAAATEFNRTQuMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FNC7/80TEUwAAA0gAAAAAMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FNC7/80TEpgAAA0gAAAAAMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80TErAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80TErAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=";
let speakToken = 0;
// iOS only lets a page play audio it started from a tap; playing silence during one unlocks the player.
// Done once, on the first tap/keypress anywhere, and never while something is playing.
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked || !player.paused) return;
  audioUnlocked = true;
  player.src = SILENT_MP3;
  player.play().catch(() => {});
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
}
addEventListener("pointerdown", unlockAudio, { capture: true });
addEventListener("keydown", unlockAudio, { capture: true });
function markSpeaking(side) {
  document.querySelectorAll(".speak").forEach(b => b.classList.toggle("playing", +b.dataset.side === side));
}
function stopSpeaking() {
  speakToken++;
  player.pause();
  if (window.speechSynthesis) speechSynthesis.cancel();
  markSpeaking(null);
}

// Google's endpoint takes ~200 characters at a time, so split on sentence / word boundaries.
function ttsChunks(text, max = 190) {
  const out = [];
  let rest = text.replace(/\s+/g, " ").trim();
  while (rest.length > max) {
    const cut = rest.slice(0, max);
    let at = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("? "), cut.lastIndexOf("! "), cut.lastIndexOf(", "));
    if (at < max / 3) at = cut.lastIndexOf(" ");
    if (at < 1) at = max - 1;
    out.push(rest.slice(0, at + 1).trim());
    rest = rest.slice(at + 1).trim();
  }
  if (rest) out.push(rest);
  return out;
}
function playUrl(url, token, rate) {
  return new Promise((resolve, reject) => {
    if (token !== speakToken) return resolve();
    const cleanup = () => { clearTimeout(startGuard); clearInterval(endWatch); player.onended = player.onerror = player.onpause = player.onplaying = null; };
    const ok = () => { cleanup(); resolve(); };
    const fail = e => { cleanup(); reject(e); };
    // If it hasn't started after a few seconds (stalled / blocked), give up rather than "playing" silence.
    const startGuard = setTimeout(() => fail(new Error("audio didn't start")), 8000);
    player.onplaying = () => clearTimeout(startGuard);
    // Google sends no length, so Safari treats the clip as a live stream and never fires "ended":
    // playback just parks at the end of the data. Treat "at the end of the buffer and not moving" as ended.
    let lastT = -1, still = 0;
    const endWatch = setInterval(() => {
      const b = player.buffered;
      if (player.paused || !b.length || player.readyState < 2) return;
      const atEnd = player.currentTime >= b.end(b.length - 1) - 0.25;
      still = atEnd && Math.abs(player.currentTime - lastT) < 0.01 ? still + 1 : 0;
      lastT = player.currentTime;
      if (still >= 2) ok();
    }, 250);
    player.onended = ok;
    player.onerror = () => fail(new Error("audio failed to load"));
    player.onpause = () => { if (token !== speakToken) ok(); };
    player.defaultPlaybackRate = rate;   // Safari resets playbackRate to this whenever a new src loads
    player.src = url;
    player.playbackRate = rate;
    player.play().catch(e => token !== speakToken ? ok() : fail(e));
  });
}
async function speakGoogle(text, code, token, rate) {
  const parts = ttsChunks(text);
  for (let i = 0; i < parts.length && token === speakToken; i++) {
    const q = new URLSearchParams({ ie: "UTF-8", client: "tw-ob", tl: code, q: parts[i], total: parts.length, idx: i, textlen: parts[i].length });
    await playUrl("https://translate.google.com/translate_tts?" + q, token, rate);
  }
}
function speakDevice(text, side, voice, token) {
  return new Promise((resolve, reject) => {
    if (!window.speechSynthesis || token !== speakToken) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : bcp47(effectiveLang(side));
    if (voice) u.voice = voice;
    const rate = rateFor(effectiveLang(side));
    u.rate = rate;
    let guard;
    const done = () => { clearTimeout(guard); resolve(); };
    // Safari silently drops speech it isn't allowed to play: treat "never started" as a failure.
    guard = setTimeout(() => { speechSynthesis.cancel(); reject(new Error("speech didn't start")); }, 2500);
    u.onstart = () => { clearTimeout(guard); guard = setTimeout(done, 3000 + text.length * 120 / rate); };   // and sometimes never fires onend
    u.onend = done;
    u.onerror = e => { clearTimeout(guard); e.error === "interrupted" || e.error === "canceled" ? resolve() : reject(new Error(e.error)); };
    speechSynthesis.speak(u);
  });
}
// Resolves when the speech has finished (or was stopped).
async function speak(text, side, voice = pickVoice(side)) {
  stopSpeaking();
  if (!text) return;
  const token = speakToken;
  markSpeaking(side);
  try {
    if (isGoogle(voice)) {
      try { await speakGoogle(text, voice === GOOGLE ? effectiveLang(side) : voice.slice(GOOGLE.length + 1), token, rateFor(effectiveLang(side))); }
      catch (e) {
        if (token !== speakToken) return;
        console.warn("Google voice failed:", e);
        if (e.name === "NotAllowedError") throw e;       // autoplay blocked: a system voice would be blocked too
        await speakDevice(text, side, voicesFor(bcp47(effectiveLang(side)))[0], token);
      }
    } else {
      await speakDevice(text, side, voice, token);
    }
  } catch (e) {
    if (token === speakToken) {
      console.warn("Speech failed:", e);
      toast(e.name === "NotAllowedError" ? "Your browser blocked auto-play. Tap the speaker to listen." : "Couldn't play the audio", 3500);
    }
  } finally {
    if (token === speakToken) markSpeaking(null);
  }
}

document.querySelectorAll(".speak").forEach(b => b.onclick = () => {
  const side = +b.dataset.side;
  if (b.classList.contains("playing")) return stopSpeaking();
  speak(els.text[side].value, side);
});

const vmenus = [...document.querySelectorAll(".vmenu")];
function closeVoiceMenus() {
  menuView[0] = menuView[1] = "main";
  vmenus.forEach(m => m.hidden = true);
  document.querySelectorAll(".voicebtn").forEach(b => b.classList.remove("open"));
}
// Voice menu: the voice list scrolls; auto-read and speed stay pinned at the bottom.
// Voice menu views: "main" (Voice / Autoplay / Playback speed rows), "voice" and "speed" (pick one).
const menuView = ["main", "main"];
const speedLabel = r => r === 1 ? "Normal" : r + "×";
function menuRow(icon, label, value, chevron) {
  const b = document.createElement("button");
  b.className = "vrow";
  b.innerHTML = `<span class="ms">${icon}</span><span class="label"></span><span class="value"></span>` + `<span class="ms chev"${chevron ? "" : ' style="visibility:hidden"'}>chevron_right</span>`;
  b.querySelector(".label").textContent = label;
  b.querySelector(".value").textContent = value;
  return b;
}
function renderVoiceMenu(side) {
  const m = vmenus[side], code = effectiveLang(side), lang = LANGS[code] || code;
  const scroll = m.querySelector(".vlist")?.scrollTop || 0;
  m.innerHTML = '<div class="vlist"></div><div class="vfoot"></div>';
  const vlist = m.querySelector(".vlist"), vfoot = m.querySelector(".vfoot");
  const heading = text => {
    const h = document.createElement("div");
    h.className = "head";
    h.textContent = text;
    vlist.appendChild(h);
  };
  const option = (label, selected, onPick, cc) => {
    const b = document.createElement("button");
    b.innerHTML = '<span class="name"></span><span class="flag"></span>';
    b.querySelector(".name").textContent = label;
    b.querySelector(".flag").textContent = flag(cc);
    if (cc) b.title = `${label} · ${regionName(cc)}`;
    b.className = selected ? "sel" : "";
    b.onclick = e => { e.stopPropagation(); onPick(); };
    vlist.appendChild(b);
  };

  const backHeader = title => {
    const back = menuRow("arrow_back", title, "", false);
    back.classList.add("back");
    back.querySelector(".chev").remove();
    back.onclick = e => { e.stopPropagation(); menuView[side] = "main"; renderVoiceMenu(side); };
    m.insertBefore(back, vlist);
    vfoot.remove();
  };

  if (menuView[side] === "speed") {
    backHeader("Playback speed");
    for (const r of SPEEDS) option(speedLabel(r), rateFor(code) === r, () => {
      if (r === 1) delete settings.rates[code]; else settings.rates[code] = r;
      saveSettings();
      menuView[side] = "main";
      renderVoiceMenu(side);
      speak(els.text[side].value.slice(0, 120) || lang, side);
    });
    return;
  }

  const list = voicesFor(bcp47(code));
  const chosen = settings.voices[side][code] || GOOGLE;
  const accents = GOOGLE_ACCENTS[code];
  const chosenLabel = chosen === GOOGLE ? (accents ? accents.def[0] : lang)
    : chosen.startsWith(GOOGLE + ":") ? accents?.more.find(a => `${GOOGLE}:${a[0]}` === chosen)?.[1] ?? lang
    : voiceName(list.find(v => v.voiceURI === chosen) || { name: lang });

  if (menuView[side] === "voice") {
    backHeader("Voice");
    const pickVoiceOption = (value, voice) => () => {
      settings.voices[side][code] = value;
      saveSettings();
      renderVoiceMenu(side);
      speak(els.text[side].value.slice(0, 120) || lang, side, voice);
    };
    heading("Google voices");
  if (accents) {
    option(accents.def[0], chosen === GOOGLE, pickVoiceOption(GOOGLE, GOOGLE), accents.def[1]);
    for (const [tl, label, cc] of accents.more) option(label, chosen === `${GOOGLE}:${tl}`, pickVoiceOption(`${GOOGLE}:${tl}`, `${GOOGLE}:${tl}`), cc);
  } else {
    option(lang, chosen === GOOGLE, pickVoiceOption(GOOGLE, GOOGLE), LANG_FLAG[code]);
  }
  if (list.length) {
    heading("System voices");
    for (const v of list) option(voiceName(v), chosen === v.voiceURI, pickVoiceOption(v.voiceURI, v), v.lang.split(/[-_]/)[1]);
  }
  vlist.scrollTop = scroll;
    return;
  }

  // Main view: settings rows, YouTube-style.
  vlist.remove();
  const voice = menuRow("record_voice_over", "Voice", chosenLabel, true);
  voice.onclick = e => { e.stopPropagation(); menuView[side] = "voice"; renderVoiceMenu(side); };

  const auto = menuRow("autoplay", "Autoplay", settings.autoRead[side] ? "On" : "Off", false);
  auto.classList.add("autoplay");
  auto.title = "Read new translations in this box aloud";
  auto.onclick = e => { e.stopPropagation(); setAutoRead(side, !settings.autoRead[side]); renderVoiceMenu(side); };
  vfoot.appendChild(auto);
  const speed = menuRow("speed", "Playback speed", speedLabel(rateFor(code)), true);
  speed.onclick = e => { e.stopPropagation(); menuView[side] = "speed"; renderVoiceMenu(side); };
  vfoot.appendChild(speed);
  vfoot.appendChild(voice);
}
document.querySelectorAll(".voicebtn").forEach(b => b.onclick = e => {
  e.stopPropagation();
  const side = +b.dataset.side, m = vmenus[side], wasOpen = !m.hidden;
  closeMenus();
  if (!wasOpen) { renderVoiceMenu(side); m.hidden = false; b.classList.add("open"); }
});
document.addEventListener("click", e => { if (!e.target.closest(".vmenu")) closeVoiceMenus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeVoiceMenus(); });
if (window.speechSynthesis) speechSynthesis.addEventListener("voiceschanged", () => vmenus.forEach((m, s) => { if (!m.hidden) renderVoiceMenu(s); }));
applyTheme();

// ---- microphone & conversation mode ----
// Browsers must be told the language up front, so conversation mode takes turns:
// listen in one box's language -> translate -> read it aloud -> listen in the other box's language.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Firefox has no speech recognition, and Brave blocks Chrome's; explain rather than hide the buttons.
// Edge uses Microsoft's speech service, which sometimes drops a request with a "network" error even
// after working fine. Once voice input has worked, treat that as a hiccup rather than "unsupported".
let voiceWorked = false;
const noVoiceInput = () => toast("Voice input isn't available in this browser. Use Chrome or Safari, or your device's dictation.", 5000);
const conv = { on: false, misses: 0 };
const micBtns = [...document.querySelectorAll(".mic")];
const convbar = document.getElementById("convbar"), convMsg = document.getElementById("conv-msg");
let rec = null;

const langName = side => LANGS[effectiveLang(side)] || effectiveLang(side);
function convStatus(msg, listening) {
  convMsg.textContent = msg;
  convbar.classList.toggle("listening", !!listening);
}
function markTurn(side) {
  els.panes.forEach((p, s) => p.classList.toggle("turn", conv.on && s === side));
  micBtns.forEach((b, s) => b.classList.toggle("listening", s === side));
}

// Recognizer lifecycle. Safari's speech service (macOS "localspeechrecognition") crashes if a new
// recognition session starts while the previous one is still shutting down, so sessions are strictly
// serialized: abort the old one, wait for its "end", leave a short gap, then start the next.
let recDone = Promise.resolve(), lastRecEnd = 0, listenSeq = 0, recFailures = 0;
const REC_GAP = 400;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function closeRec() {
  const r = rec;
  rec = null;
  if (!r) return;
  r.onresult = r.onerror = null;      // keep onend: it resolves recDone
  try { r.abort(); } catch {}
}

async function listen(side) {
  const seq = ++listenSeq;
  closeRec();
  markTurn(side);
  if (conv.on) convStatus(`Listening in ${langName(side)}…`, true);
  await Promise.race([recDone, sleep(1500)]);
  const wait = lastRecEnd + REC_GAP - Date.now();
  if (wait > 0) await sleep(wait);
  if (seq !== listenSeq) return;      // superseded by another listen() or a stop

  const t = els.text[side], other = els.text[1 - side];
  const r = new SR();
  let done;
  recDone = new Promise(res => done = res);
  rec = r;
  r.lang = bcp47(state.lang[side] === AUTO ? (state.detected[side] || AUTO) : state.lang[side]);
  r.interimResults = true;
  r.continuous = false;               // stop at the first pause: one utterance per turn
  let heard = "", cleared = false, failed = false;
  r.onresult = e => {
    heard = [...e.results].map(x => x[0].transcript).join("");
    voiceWorked = true;
    if (!cleared) { other.value = ""; cleared = true; }   // new speech starts a fresh translation
    t.value = heard.slice(0, MAX);
    state.source = side;
    state.typed = false;
    refresh();
  };
  r.onerror = e => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (e.error === "not-allowed") { toast("Microphone permission denied"); return stopConversation(); }
    if (e.error === "service-not-allowed" || (e.error === "network" && !voiceWorked)) { noVoiceInput(); return stopConversation(); }
    if (e.error === "language-not-supported") { toast(`Voice input doesn't support ${langName(side)} in this browser`, 4000); return stopConversation(); }
    // Anything else (a dropped request, the speech service restarting…): conversation mode retries with
    // back-off in finishTurn; a one-off mic tap just says so.
    failed = true;
    if (!conv.on) toast("The speech service didn't respond. Tap the mic to try again.", 4000);
  };
  r.onend = () => {
    lastRecEnd = Date.now();
    done();
    if (rec === r) { rec = null; finishTurn(side, heard.trim(), failed, seq); }
  };
  try { r.start(); } catch { rec = null; done(); markTurn(null); toast("Mic unavailable"); }
}

async function finishTurn(side, heard, failed, seq) {
  markTurn(null);
  // Only carry on if nothing else (a mic tap, Stop) has taken over since this turn started.
  const next = (s, delay) => setTimeout(() => conv.on && listenSeq === seq && listen(s), delay);
  if (!heard) {
    if (!conv.on) return;
    if (failed) recFailures++;
    conv.misses++;
    if (recFailures >= 3) { stopConversation(); return toast("Speech recognition stopped responding. Try again in a moment.", 4000); }
    if (conv.misses >= 6) { stopConversation(); return toast("Conversation paused: no speech heard"); }
    return next(side, failed ? 500 * 2 ** recFailures : 300);   // back off when the service is failing
  }
  conv.misses = 0;
  recFailures = 0;
  if (conv.on) convStatus("Translating…");
  clearTimeout(timer);
  state.source = side;
  const ok = await translateFrom(side);
  if (!ok) { if (conv.on) stopConversation(); return; }
  if (settings.autoRead[1 - side]) {
    if (conv.on) convStatus(`Speaking ${langName(1 - side)}…`);
    await speak(els.text[1 - side].value, 1 - side);
  }
  if (conv.on) next(1 - side, 300);
}

function stopMic() {
  listenSeq++;                        // cancels any listen() still waiting to start
  closeRec();
  markTurn(null);
}
function startConversation(side = 0) {
  conv.on = true; conv.misses = 0; recFailures = 0;
  conv.savedAutoRead = [...settings.autoRead];
  settings.autoRead = [true, true];
  renderAutoRead();
  document.getElementById("conv-btn").classList.add("on");
  convbar.hidden = false;
  unlockAudio();
  listen(side);
}
function stopConversation() {
  if (conv.on && conv.savedAutoRead) { settings.autoRead = conv.savedAutoRead; renderAutoRead(); }
  conv.on = false;
  stopMic();
  stopSpeaking();
  document.getElementById("conv-btn").classList.remove("on");
  convbar.hidden = true;
}

micBtns.forEach((b, side) => {
  b.onclick = () => {
    if (!SR) return noVoiceInput();
    const active = b.classList.contains("listening");
    stopSpeaking();
    unlockAudio();
    if (active && !conv.on) return stopMic();
    conv.misses = 0;
    listen(side);                      // in conversation mode this also hands the turn to this side
  };
});
const convBtn = document.getElementById("conv-btn");
convBtn.onclick = () => !SR ? noVoiceInput() : conv.on ? stopConversation() : startConversation(0);
document.getElementById("conv-stop").onclick = stopConversation;

// Per-box auto read-aloud: anything translated into a box with this on gets spoken.
// The toggle lives in the box's voice menu; a dot on the menu arrow shows when it's on.
function renderAutoRead() {
  document.querySelectorAll(".voicebtn").forEach(b => {
    const s = +b.dataset.side;
    b.classList.toggle("auto", settings.autoRead[s]);
    b.title = settings.autoRead[s] ? "Voice options (autoplay is on)" : "Voice options";
  });
  vmenus.forEach((m, s) => { const v = m.querySelector(".autoplay .value"); if (v) v.textContent = settings.autoRead[s] ? "On" : "Off"; });
}
function setAutoRead(side, on) {
  settings.autoRead[side] = on;
  saveSettings();                        // during a conversation this keeps the pre-conversation choice
  if (!on && document.querySelector(`.speak[data-side="${side}"]`).classList.contains("playing")) stopSpeaking();
  if (on) unlockAudio();
  renderAutoRead();
}
renderAutoRead();

// iOS Safari ignores user-scalable=no for pinches, so block its pinch gestures directly.
for (const type of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(type, e => e.preventDefault(), { passive: false });

let toastTimer;
function toast(msg, ms = 1800) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

refresh();
els.text[0].focus();
</script>
</body>
</html>
