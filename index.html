<script>
const LANGS = {
  af:"Afrikaans", sq:"Albanian", am:"Amharic", ar:"Arabic", hy:"Armenian", as:"Assamese", ay:"Aymara", az:"Azerbaijani",
  bm:"Bambara", eu:"Basque", be:"Belarusian", bn:"Bengali", bho:"Bhojpuri", bs:"Bosnian", bg:"Bulgarian", ca:"Catalan",
  ceb:"Cebuano", ny:"Chichewa", "zh-CN":"Chinese (Simplified)", "zh-TW":"Chinese (Traditional)", co:"Corsican", hr:"Croatian",
  cs:"Czech", da:"Danish", dv:"Dhivehi", doi:"Dogri", nl:"Dutch", en:"English", eo:"Esperanto", et:"Estonian", ee:"Ewe",
  tl:"Filipino", fi:"Finnish", fr:"French", fy:"Frisian", gl:"Galician", ka:"Georgian", de:"German", el:"Greek",
  gn:"Guarani", gu:"Gujarati", ht:"Haitian Creole", ha:"Hausa", haw:"Hawaiian", iw:"Hebrew", hi:"Hindi", hmn:"Hmong",
  hu:"Hungarian", is:"Icelandic", ig:"Igbo", ilo:"Ilocano", id:"Indonesian", ga:"Irish", it:"Italian", ja:"Japanese",
  jw:"Javanese", kn:"Kannada", kk:"Kazakh", km:"Khmer", rw:"Kinyarwanda", gom:"Konkani", ko:"Korean", kri:"Krio",
  ku:"Kurdish (Kurmanji)", ckb:"Kurdish (Sorani)", ky:"Kyrgyz", lo:"Lao", la:"Latin", lv:"Latvian", ln:"Lingala",
  lt:"Lithuanian", lg:"Luganda", lb:"Luxembourgish", mk:"Macedonian", mai:"Maithili", mg:"Malagasy", ms:"Malay",
  ml:"Malayalam", mt:"Maltese", mi:"Maori", mr:"Marathi", "mni-Mtei":"Meiteilon (Manipuri)", lus:"Mizo", mn:"Mongolian",
  my:"Myanmar (Burmese)", ne:"Nepali", no:"Norwegian", or:"Odia (Oriya)", om:"Oromo", ps:"Pashto", fa:"Persian",
  pl:"Polish", pt:"Portuguese (Brazil)", "pt-PT":"Portuguese (Portugal)", pa:"Punjabi", qu:"Quechua", ro:"Romanian", ru:"Russian", sm:"Samoan", sa:"Sanskrit",
  gd:"Scots Gaelic", nso:"Sepedi", sr:"Serbian", st:"Sesotho", sn:"Shona", sd:"Sindhi", si:"Sinhala", sk:"Slovak",
  sl:"Slovenian", so:"Somali", es:"Spanish", su:"Sundanese", sw:"Swahili", sv:"Swedish", tg:"Tajik", ta:"Tamil",
  tt:"Tatar", te:"Telugu", th:"Thai", ti:"Tigrinya", ts:"Tsonga", tr:"Turkish", tk:"Turkmen", ak:"Twi", uk:"Ukrainian",
  ur:"Urdu", ug:"Uyghur", uz:"Uzbek", vi:"Vietnamese", cy:"Welsh", xh:"Xhosa", yi:"Yiddish", yo:"Yoruba", zu:"Zulu"
};
const AUTO = "auto";
const MOD = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent) ? "Cmd" : "Ctrl";
const MAX = 5000;

// ---- state (persisted) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem("tr:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tr:" + k, JSON.stringify(v)); } catch {} }
};
// First visit: travellers get the local language on the right, locals get English.
const COUNTRY_LANG = {
  BR: "pt", PT: "pt-PT", ES: "es", MX: "es", AR: "es", CO: "es", CL: "es", PE: "es", VE: "es", EC: "es", GT: "es",
  CU: "es", BO: "es", DO: "es", HN: "es", PY: "es", SV: "es", NI: "es", CR: "es", PA: "es", UY: "es", PR: "es",
  FR: "fr", BE: "nl", NL: "nl", DE: "de", AT: "de", CH: "de", LU: "fr", IT: "it", PL: "pl", CZ: "cs", SK: "sk",
  HU: "hu", RO: "ro", MD: "ro", BG: "bg", GR: "el", CY: "el", TR: "tr", RU: "ru", BY: "be", UA: "uk", SE: "sv",
  NO: "no", DK: "da", FI: "fi", IS: "is", EE: "et", LV: "lv", LT: "lt", HR: "hr", RS: "sr", ME: "sr", SI: "sl",
  BA: "bs", MK: "mk", AL: "sq", MT: "mt", GE: "ka", AM: "hy", AZ: "az", KZ: "kk", UZ: "uz", KG: "ky", TJ: "tg",
  JP: "ja", KR: "ko", CN: "zh-CN", TW: "zh-TW", HK: "zh-TW", MO: "zh-TW", TH: "th", VN: "vi", ID: "id", MY: "ms",
  PH: "tl", KH: "km", LA: "lo", MM: "my", MN: "mn", IN: "hi", PK: "ur", BD: "bn", NP: "ne", LK: "si", IL: "iw",
  IR: "fa", AF: "ps", SA: "ar", AE: "ar", EG: "ar", MA: "ar", DZ: "ar", TN: "ar", JO: "ar", LB: "ar", IQ: "ar",
  QA: "ar", KW: "ar", OM: "ar", BH: "ar", LY: "ar", SY: "ar", YE: "ar", SD: "ar", KE: "sw", TZ: "sw", ET: "am",
  SO: "so", RW: "rw", MG: "mg", HT: "ht", SN: "fr", CI: "fr", CM: "fr", ML: "fr", CD: "fr", AO: "pt", MZ: "pt",
};
function guessLangs() {
  const target = COUNTRY_LANG[window.COUNTRY];
  if (!target) return [AUTO, "en"];
  const base = tag => tag.toLowerCase().split(/[-_]/)[0];
  const browser = { fil: "tl", he: "iw", nb: "no", nn: "no" }[base(navigator.language || "en")] ?? base(navigator.language || "en");
  return [AUTO, browser === base(target) ? "en" : target];
}

const state = {
  lang: store.get("lang", null) ?? guessLangs(),     // only the left side can be "auto" (Detect)
  recent: store.get("recent", [["en", "es", "fr"], ["en", "es", "fr"]]),
  detected: [null, null],                             // last detected language per side
  source: null,                                       // side the user last typed in
};
if (state.lang[1] === AUTO) state.lang[1] = state.lang[0] === "en" ? "es" : "en";

const els = {
  text: [document.getElementById("text-0"), document.getElementById("text-1")],
  panes: [...document.querySelectorAll(".pane")],
  tabs: [document.getElementById("tabs-0"), document.getElementById("tabs-1")],
  count: [document.getElementById("count-0"), document.getElementById("count-1")],
  clear: [...document.querySelectorAll(".clear")],
  status: document.getElementById("status"),
  picker: document.getElementById("picker"),
  pickerSearch: document.getElementById("picker-search"),
  pickerList: document.getElementById("picker-list"),
};

function effectiveLang(side) {
  const l = state.lang[side];
  return l !== AUTO ? l : (state.detected[side] || "en");
}

// ---- translation ----
async function googleTranslate(text, sl, tl, signal) {
  const body = new URLSearchParams({ q: text });
  const url = `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}`;
  try {
    const r = await fetch(url, { method: "POST", body, signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    // sl=auto -> [["text","fr"]]; explicit sl -> ["text"]
    const first = j[0];
    return Array.isArray(first) ? { text: first[0], detected: first[1] } : { text: first, detected: null };
  } catch (e) {
    if (e.name === "AbortError") throw e;
    const u2 = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}`;
    const r = await fetch(u2, { method: "POST", body, signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    return { text: (j[0] || []).map(s => s[0]).join(""), detected: j[2] || null };
  }
}

let timer = null, controller = null, readTimer = null;
function schedule(side, delay = 350) {
  clearTimeout(timer);
  timer = setTimeout(() => translateFrom(side), delay);
}

async function translateFrom(side) {
  const other = 1 - side;
  const text = els.text[side].value;
  if (controller) controller.abort();
  if (!text.trim()) {
    setLoading(false);
    els.text[other].value = "";
    if (state.lang[side] === AUTO) state.detected[side] = null;
    refresh();
    return;
  }
  controller = new AbortController();
  const sl = state.lang[side];
  const tl = effectiveLang(other);
  setStatus("");
  setLoading(true);
  try {
    const res = await googleTranslate(text, sl, tl, controller.signal);
    if (state.source !== side || els.text[side].value !== text) return; // stale
    els.text[other].value = res.text;
    if (sl === AUTO && res.detected) state.detected[side] = res.detected;
    setLoading(false);
    refresh();
    if (state.typed && settings.autoRead[other]) {
      clearTimeout(readTimer);
      readTimer = setTimeout(() => speak(res.text, other), 1200);
    }
    return true;
  } catch (e) {
    if (e.name === "AbortError") return;
    setLoading(false);
    setStatus("Translation failed: " + e.message, true);
  }
}

let loadTimer = null;
function setLoading(on) {
  clearTimeout(loadTimer);
  const bar = document.getElementById("loadbar");
  if (on) loadTimer = setTimeout(() => bar.classList.add("on"), 250);
  else bar.classList.remove("on");
}

function setStatus(msg, err) {
  els.status.textContent = msg;
  els.status.classList.toggle("err", !!err);
}

// ---- UI ----
// Each side has one indicator ("ink") that slides to the active tab; tabs are rebuilt around it.
function positionInk(side) {
  const box = els.tabs[side], ink = box.querySelector(".ink"), active = box.querySelector(".tab.active");
  if (!ink) return;
  ink.style.width = active ? active.offsetWidth + "px" : "0";
  ink.style.transform = `translateX(${active ? active.offsetLeft : 0}px)`;
  updateTabFades(side);
}
// Fade whichever edge has tabs scrolled out of view.
function updateTabFades(side) {
  const box = els.tabs[side];
  box.classList.toggle("fade-start", box.scrollLeft > 1);
  box.classList.toggle("fade-end", box.scrollLeft + box.clientWidth < box.scrollWidth - 1);
}
// Keep the active tab in view within its (scrollable) row.
function revealActiveTab(side) {
  const box = els.tabs[side], active = box.querySelector(".tab.active");
  if (!active) return;
  if (active.offsetLeft < box.scrollLeft) box.scrollLeft = active.offsetLeft;
  else if (active.offsetLeft + active.offsetWidth > box.scrollLeft + box.clientWidth) box.scrollLeft = active.offsetLeft + active.offsetWidth - box.clientWidth;
}
function renderTabs(side) {
  const box = els.tabs[side];
  let ink = box.querySelector(".ink");
  if (!ink) {
    ink = document.createElement("span");
    ink.className = "ink";
    box.appendChild(ink);
    // Only animate once fonts have loaded, so the first alignment (and any font-driven reflow) doesn't slide.
    (document.fonts?.ready ?? Promise.resolve()).then(() => requestAnimationFrame(() => requestAnimationFrame(() => ink.classList.add("animate"))));
  }
  box.querySelectorAll(".tab").forEach(t => t.remove());
  const sel = state.lang[side];
  const detectLabel = sel === AUTO && state.detected[side] && LANGS[state.detected[side]]
    ? `${LANGS[state.detected[side]]} - Detected` : "Detect language";
  if (sel !== AUTO && !state.recent[side].includes(sel)) state.recent[side] = [sel, ...state.recent[side]].slice(0, 3);
  const items = [...(side === 0 ? [[AUTO, detectLabel]] : []), ...state.recent[side].map(c => [c, LANGS[c]])];
  for (const [code, label] of items) {
    const b = document.createElement("button");
    b.className = "tab" + (code === sel ? " active" : "");
    b.textContent = label;
    b.onclick = e => {
      if (code !== state.lang[side]) return chooseLang(side, code);
      e.stopPropagation();               // clicking the selected language opens (or closes) the full list
      openPicker(side);
    };
    box.insertBefore(b, ink);
  }
  if (!box.dataset.scrollWatch) { box.dataset.scrollWatch = 1; box.addEventListener("scroll", () => updateTabFades(side), { passive: true }); }
  revealActiveTab(side);
  positionInk(side);
}

function fitText(t) {
  t.classList.remove("medium", "small");
  for (const size of ["medium", "small"]) {
    if (t.scrollHeight <= t.clientHeight + 1) break;
    t.classList.remove("medium", "small");
    t.classList.add(size);
  }
}
addEventListener("resize", () => { els.text.forEach(fitText); positionInk(0); positionInk(1); });
document.fonts?.ready.then(() => { positionInk(0); positionInk(1); els.text.forEach(fitText); });

function refresh() {
  for (const s of [0, 1]) {
    renderTabs(s);
    const t = els.text[s];
    const n = t.value.length;
    els.count[s].textContent = `${n.toLocaleString()} / ${MAX.toLocaleString()}`;
    els.clear[s].hidden = n === 0;
    fitText(t);
    els.panes[s].classList.toggle("output", state.source != null && state.source !== s && n > 0);
  }
  const swapBtn = document.getElementById("swap");
  swapBtn.disabled = state.lang[0] === AUTO;
  swapBtn.title = `Swap languages (${MOD}+Shift+S)`;
  store.set("lang", state.lang);
  store.set("recent", state.recent);
}

function chooseLang(side, code) {
  // Picking the other box's language swaps them, like Google. With Detect on the left, the detected
  // language takes the left's place in the swap.
  if (code !== AUTO && code === state.lang[1 - side]) {
    closePicker();
    if (state.lang[0] !== AUTO) return swap();
    const detected = state.detected[0];
    if (detected && detected !== code) {
      state.lang[0] = detected;
      return swap();
    }
    // Left text is already in this language (or undetected): keep it and give the right a new language.
    state.lang = [code, code === "en" ? "es" : "en"];
    for (const s of [0, 1]) if (!state.recent[s].includes(state.lang[s])) state.recent[s] = [state.lang[s], ...state.recent[s]].slice(0, 3);
    state.source = 0;
    refresh();
    return retranslate();
  }
  state.lang[side] = code;
  // Recent tabs stay put; only a language that isn't already there gets added (dropping the oldest).
  if (code !== AUTO && !state.recent[side].includes(code)) state.recent[side] = [code, ...state.recent[side]].slice(0, 3);
  closePicker();
  refresh();
  retranslate();
}

function retranslate() {
  const src = state.source ?? (els.text[0].value ? 0 : els.text[1].value ? 1 : null);
  if (src == null) return;
  state.source = src;
  translateFrom(src);
}

for (const side of [0, 1]) {
  const t = els.text[side];
  t.maxLength = MAX;
  t.addEventListener("input", () => {
    state.source = side;
    state.typed = true;
    clearTimeout(readTimer);
    if (!conv.on) stopSpeaking();
    refresh();
    schedule(side);
  });
  t.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); state.source = side; clearTimeout(timer); translateFrom(side); }
  });
  els.clear[side].onclick = () => {
    t.value = ""; els.text[1 - side].value = ""; state.source = side;
    if (controller) controller.abort();
    refresh(); t.focus();
  };
}

document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
  const v = els.text[+b.dataset.side].value;
  if (!v) return;
  try { await navigator.clipboard.writeText(v); toast("Translation copied"); } catch { toast("Copy failed"); }
});


function swap() {
  if (state.lang[0] === AUTO) return;
  state.lang = [state.lang[1], state.lang[0]];
  for (const s of [0, 1]) if (state.lang[s] !== AUTO && !state.recent[s].includes(state.lang[s])) {
    state.recent[s] = [state.lang[s], ...state.recent[s]].slice(0, 3);
  }
  const [t0, t1] = [els.text[0].value, els.text[1].value];
  els.text[0].value = t1; els.text[1].value = t0;
  if (state.source != null) state.source = 1 - state.source;
  refresh();
}
document.getElementById("swap").onclick = swap;
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "s" && e.shiftKey && (e.ctrlKey || e.metaKey)) { e.preventDefault(); swap(); }
  if (e.key === "Escape") closePicker();
});

// ---- dropdowns: only one open at a time ----
function closeMenus(except) {
  if (except !== "picker") closePicker();
  if (except !== "voice") closeVoiceMenus();
  if (except !== "settings") document.getElementById("settings").hidden = true;
}

// ---- language picker ----
let pickerSide = null;
// The dropdown covers the text boxes exactly: from under the tabs to the bottom of the boxes.
function sizePicker() {
  if (els.picker.hidden) return;
  if (smallScreen.matches) { els.picker.style.height = ""; return; }   // full screen on phones
  const top = els.picker.getBoundingClientRect().top;
  els.picker.style.height = Math.max(200, document.querySelector(".panes").getBoundingClientRect().bottom - top) + "px";
}
addEventListener("resize", sizePicker);
function openPicker(side) {
  if (pickerSide === side) return closePicker();
  closeMenus("picker");
  pickerSide = side;
  document.querySelectorAll(".more").forEach(m => m.classList.toggle("open", +m.dataset.side === side));
  els.picker.hidden = false;
  sizePicker();
  els.pickerSearch.value = "";
  renderPicker();
  document.body.classList.toggle("picker-open", smallScreen.matches);
  if (smallScreen.matches) document.querySelectorAll(".ripple-host").forEach(h => h.remove());   // don't fade over the full-screen list
  if (!smallScreen.matches) els.pickerSearch.focus();   // on phones, don't pop the keyboard over the list
}
function closePicker() {
  document.body.classList.remove("picker-open");
  pickerSide = null;
  els.picker.hidden = true;
  document.querySelectorAll(".more").forEach(m => m.classList.remove("open"));
}

function speedControl(initial, onChange, onSettle) {

      <button class="round" aria-label="Faster">+</button>

    el.querySelectorAll(".chips button").forEach(b => b.classList.toggle("on", Math.abs(+b.dataset.r - value) < 0.001));

applyTheme();

// ---- microphone & conversation mode ----
// Speech recognition needs the language up front, so conversation mode alternates between the boxes.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Firefox has no speech recognition, and Brave blocks Chrome's; explain rather than hide the buttons.
// Edge's speech service drops the odd request with "network"; only treat that as unsupported before it has worked.
let voiceWorked = false;
const noVoiceInput = () => toast("Voice input isn't available in this browser. Use Chrome or Safari, or your device's dictation.", 5000);
const conv = { on: false, misses: 0 };
const micBtns = [...document.querySelectorAll(".mic")];
const convbar = document.getElementById("convbar"), convMsg = document.getElementById("conv-msg");
let rec = null;

const langName = side => LANGS[effectiveLang(side)] || effectiveLang(side);
function convStatus(msg, listening) {
  convMsg.textContent = msg;
  convbar.classList.toggle("listening", !!listening);
}
function markTurn(side) {
  els.panes.forEach((p, s) => p.classList.toggle("turn", conv.on && s === side));
  micBtns.forEach((b, s) => b.classList.toggle("listening", s === side));
}

// Safari's speech service crashes if a session starts while the last one is still ending, so sessions
// are serialized: abort, wait for "end", leave a gap, then start.
let recDone = Promise.resolve(), lastRecEnd = 0, listenSeq = 0, recFailures = 0;
const REC_GAP = 400;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function closeRec() {
  const r = rec;
  rec = null;
  if (!r) return;
  r.onresult = r.onerror = null;      // keep onend: it resolves recDone
  try { r.abort(); } catch {}
}

async function listen(side) {
  const seq = ++listenSeq;
  closeRec();
  markTurn(side);
  if (conv.on) convStatus(`Listening in ${langName(side)}…`, true);
  await Promise.race([recDone, sleep(1500)]);
  const wait = lastRecEnd + REC_GAP - Date.now();
  if (wait > 0) await sleep(wait);
  if (seq !== listenSeq) return;      // superseded by another listen() or a stop

  const t = els.text[side], other = els.text[1 - side];
  const r = new SR();
  let done;
  recDone = new Promise(res => done = res);
  rec = r;
  r.lang = bcp47(state.lang[side] === AUTO ? (state.detected[side] || AUTO) : state.lang[side]);
  r.interimResults = true;
  r.continuous = false;               // stop at the first pause: one utterance per turn
  let heard = "", cleared = false, failed = false;
  r.onresult = e => {
    heard = [...e.results].map(x => x[0].transcript).join("");
    voiceWorked = true;
    if (!cleared) { other.value = ""; cleared = true; }   // new speech starts a fresh translation
    t.value = heard.slice(0, MAX);
    state.source = side;
    state.typed = false;
    refresh();
  };
  r.onerror = e => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (e.error === "not-allowed") { toast("Microphone permission denied"); return stopConversation(); }
    if (e.error === "service-not-allowed" || (e.error === "network" && !voiceWorked)) { noVoiceInput(); return stopConversation(); }
    if (e.error === "language-not-supported") { toast(`Voice input doesn't support ${langName(side)} in this browser`, 4000); return stopConversation(); }
    // Anything else is transient: conversation mode retries with back-off in finishTurn.
    failed = true;
    if (!conv.on) toast("The speech service didn't respond. Tap the mic to try again.", 4000);
  };
  r.onend = () => {
    lastRecEnd = Date.now();
    done();
    if (rec === r) { rec = null; finishTurn(side, heard.trim(), failed, seq); }
  };
  try { r.start(); } catch { rec = null; done(); markTurn(null); toast("Mic unavailable"); }
}

async function finishTurn(side, heard, failed, seq) {
  markTurn(null);
  // Skip if a mic tap or Stop has taken over since this turn started.
  const next = (s, delay) => setTimeout(() => conv.on && listenSeq === seq && listen(s), delay);
  if (!heard) {
    if (!conv.on) return;
    if (failed) recFailures++;
    conv.misses++;
    if (recFailures >= 3) { stopConversation(); return toast("Speech recognition stopped responding. Try again in a moment.", 4000); }
    if (conv.misses >= 6) { stopConversation(); return toast("Conversation paused: no speech heard"); }
    return next(side, failed ? 500 * 2 ** recFailures : 300);   // back off when the service is failing
  }
  conv.misses = 0;
  recFailures = 0;
  if (conv.on) convStatus("Translating…");
  clearTimeout(timer);
  state.source = side;
  const ok = await translateFrom(side);
  if (!ok) { if (conv.on) stopConversation(); return; }
  if (settings.autoRead[1 - side]) {
    if (conv.on) convStatus(`Speaking ${langName(1 - side)}…`);
    await speak(els.text[1 - side].value, 1 - side);
  }
  if (conv.on) next(1 - side, 300);
}

function stopMic() {
  listenSeq++;                        // cancels any listen() still waiting to start
  closeRec();
  markTurn(null);
}
function startConversation(side = 0) {
  conv.on = true; conv.misses = 0; recFailures = 0;
  conv.savedAutoRead = [...settings.autoRead];
  settings.autoRead = [true, true];
  renderAutoRead();
  document.getElementById("conv-btn").classList.add("on");
  convbar.hidden = false;
  unlockAudio();
  listen(side);
}
function stopConversation() {
  if (conv.on && conv.savedAutoRead) { settings.autoRead = conv.savedAutoRead; renderAutoRead(); }
  conv.on = false;
  stopMic();
  stopSpeaking();
  document.getElementById("conv-btn").classList.remove("on");
  convbar.hidden = true;
}

micBtns.forEach((b, side) => {
  b.onclick = () => {
    if (!SR) return noVoiceInput();
    const active = b.classList.contains("listening");
    stopSpeaking();
    unlockAudio();
    if (active && !conv.on) return stopMic();
    conv.misses = 0;
    listen(side);                      // in conversation mode this also hands the turn to this side
  };
});
const convBtn = document.getElementById("conv-btn");
convBtn.onclick = () => !SR ? noVoiceInput() : conv.on ? stopConversation() : startConversation(0);
document.getElementById("conv-stop").onclick = stopConversation;

// Per-box autoplay; a dot on the voice menu arrow shows when it's on.
function renderAutoRead() {
  document.querySelectorAll(".voicebtn").forEach(b => {
    const s = +b.dataset.side;
    b.classList.toggle("auto", settings.autoRead[s]);
    b.title = settings.autoRead[s] ? "Voice options (autoplay is on)" : "Voice options";
  });
  vmenus.forEach((m, s) => { const v = m.querySelector(".autoplay .value"); if (v) v.textContent = settings.autoRead[s] ? "On" : "Off"; });
}
function setAutoRead(side, on) {
  settings.autoRead[side] = on;
  saveSettings();                        // during a conversation this keeps the pre-conversation choice
  if (!on && document.querySelector(`.speak[data-side="${side}"]`).classList.contains("playing")) stopSpeaking();
  if (on) unlockAudio();
  renderAutoRead();
}
renderAutoRead();

// iOS ignores user-scalable=no for pinches.
for (const type of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(type, e => e.preventDefault(), { passive: false });

// Material-style ripple on buttons and tabs (centred on icon buttons, from the touch point elsewhere).
// It's drawn on an overlay rather than inside the button, so re-rendering the button (tabs, menus)
// doesn't cut it short, and it always finishes expanding before fading, even on a quick tap.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("button, a.iconbtn");
  if (!el || el.disabled || reduceMotion.matches) return;
  const r = el.getBoundingClientRect();
  const host = document.createElement("span");
  host.className = "ripple-host" + (el.matches(".mic.listening, .speak.playing, .convbtn.on, .convbar button") ? " light" : "");
  const cs = getComputedStyle(el);   // ripple takes the button's own colour (blue on the active tab, etc.)
  host.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${cs.borderRadius};color:${cs.color}`;
  const centred = el.matches(".iconbtn, .more, .swap");
  const size = Math.hypot(r.width, r.height) * (centred ? 1 : 2);
  const x = centred ? r.width / 2 : e.clientX - r.left, y = centred ? r.height / 2 : e.clientY - r.top;
  const dot = document.createElement("span");
  dot.className = "ripple";
  dot.style.cssText = `width:${size}px;height:${size}px;left:${x - size / 2}px;top:${y - size / 2}px`;
  host.appendChild(dot);
  document.body.appendChild(host);
  // Inside a dropdown, drop the ripple as soon as the item goes (menu closed or switched view).
  const menu = el.closest(".vmenu, .picker, .settings");
  if (menu) (function watch() {
    if (!host.isConnected) return;
    if (!el.isConnected || menu.hidden) host.remove(); else requestAnimationFrame(watch);
  })();
  const start = performance.now();
  const release = () => setTimeout(() => {
    dot.classList.add("out");
    setTimeout(() => host.remove(), 350);
  }, Math.max(0, 300 - (performance.now() - start)));
  addEventListener("pointerup", release, { once: true });
  addEventListener("pointercancel", release, { once: true });
}, { passive: true });

// Google-style tooltips from title attributes (native ones suppressed): after a short hover with a
// mouse, or on keyboard focus. Titles set later by the code are picked up on the next hover.
const tip = document.createElement("div");
tip.className = "tooltip";
tip.setAttribute("role", "tooltip");
document.body.appendChild(tip);
let tipTimer = null, tipFor = null;
function adoptTitle(el) {
  if (el.title) {
    el.dataset.tip = el.title;
    el.setAttribute("aria-label", el.title);
    el.removeAttribute("title");
  }
  return el.dataset.tip;
}
function showTip(el) {
  const text = adoptTitle(el);
  if (!text || !el.isConnected) return;
  tip.textContent = text;
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 8);
  const below = r.bottom + 8;
  tip.style.left = left + "px";
  tip.style.top = (below + t.height > innerHeight - 8 ? r.top - t.height - 8 : below) + "px";
  tip.classList.add("show");
}
function hideTip() {
  clearTimeout(tipTimer);
  tipFor = null;
  tip.classList.remove("show");
}
document.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const el = e.target.closest("[title], [data-tip]");
  if (el === tipFor) return;
  hideTip();
  if (!el) return;
  adoptTitle(el);
  tipFor = el;
  tipTimer = setTimeout(() => showTip(el), 500);
});
document.addEventListener("mouseleave", hideTip);
document.addEventListener("pointerdown", hideTip, true);
addEventListener("scroll", hideTip, true);
document.addEventListener("focusin", e => {
  const el = e.target.closest?.("[title], [data-tip]");
  if (el?.matches(":focus-visible")) { tipFor = el; showTip(el); }
});
document.addEventListener("focusout", hideTip);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });

// Settings menu: the box menus' Autoplay / Playback speed rows, applied to both boxes and every language.
let settingsView = "main";
function renderSettingsMenu() {
  const m = settingsPanel;
  m.innerHTML = '<div class="vlist"></div><div class="vfoot"></div>';
  const vlist = m.querySelector(".vlist"), vfoot = m.querySelector(".vfoot");
  const rerender = view => e => { e.stopPropagation(); settingsView = view; renderSettingsMenu(); };
  const uniformRate = Object.keys(settings.rates).length ? null : settings.defaultRate ?? 1;

  if (settingsView === "speed") {
    const back = menuRow("arrow_back", "Playback speed", "", false);
    back.classList.add("back");
    back.querySelector(".chev").remove();
    back.onclick = rerender("main");
    m.insertBefore(back, vlist);
    vfoot.remove();
    vlist.appendChild(speedControl(uniformRate ?? settings.defaultRate ?? 1, r => {
      settings.rates = {};
      if (r === 1) delete settings.defaultRate; else settings.defaultRate = r;
      saveSettings();
      applyLiveRate();
    }));
    return;
  }

  vlist.remove();
  const [a, b] = conv.on ? conv.savedAutoRead : settings.autoRead;
  const auto = menuRow("autoplay", "Autoplay", a === b ? (a ? "On" : "Off") : "Mixed", false);
  auto.classList.add("autoplay");
  auto.onclick = e => {
    const on = !(a && b);
    if (conv.on) conv.savedAutoRead = [on, on];
    settings.autoRead = [on, on];
    if (!on) stopSpeaking();
    saveSettings();
    renderAutoRead();
    rerender("main")(e);
  };
  vfoot.appendChild(auto);
  const speed = menuRow("gauge", "Playback speed", uniformRate ? speedLabel(uniformRate) : "Mixed", true);
  speed.onclick = rerender("speed");
  vfoot.appendChild(speed);
}
document.getElementById("settings-btn").addEventListener("click", () => { settingsView = "main"; renderSettingsMenu(); });

let toastTimer;
function toast(msg, ms = 1800) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

refresh();
els.text[0].focus();
</script>
</body>
</html>
